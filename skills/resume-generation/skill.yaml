name: resume-generation
kind: skill
description: Generate a tailored, factual resume from profile content for a screened JD, with verification gate and evaluation report
status: active
pinned: v3
latest: v3
policies:
  - factuality
  - evidence-grounding
  - company-descriptors
  - storage-routing
inputs:
  - application_folder   # e.g. applications/2026-06-12-acme-se/
  - profile              # matched profile name
outputs:
  - resume_md            # the resume markdown artifact
  - evaluation_report    # JD-coverage scoring + Recruiter & ATS Appeal Analysis (written to notes.md)
changelog:
  - version: v3
    date: 2026-06-15
    summary: Added Phase 0.5 per-requirement semantic retrieval (search_chunks_semantic) and structural anchor fall-back (OB1 mode); added Phase 0.75 cross-app domain patterns via find_similar_applications; local mode falls back to full file reads
  - version: v2
    date: 2026-06-13
    summary: Added one-idea-per-bullet/semicolon rule, expanded Capabilities section format (## heading required, trailing <br> spaces), and Pandoc blank-line-before-bullets rule
  - version: v1
    date: 2026-06-12
    summary: Migrated from memory/feedback_resume_generation.md (minus cover-letter rules), CLAUDE.md Resume Generation + Review-before-PDF, workflow.md Resume Generation Pipeline, and memory/MEMORY.md construction standards
