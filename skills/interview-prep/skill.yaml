name: interview-prep
kind: skill
description: Generate an interview prep brief for a specific application and stage — required reading, output structure, stage inference, warm connections
status: active
pinned: v4
latest: v4
policies:
  - factuality
  - storage-routing
inputs:
  - application_folder
  - stage               # optional; inferred from notes.md Process section when absent
outputs:
  - prep_brief
changelog:
  - version: v4
    date: 2026-07-13
    summary: >
      Context Loading — Session Reuse section added: do-not-re-read guard for this skill
      and its companion policies (factuality, storage-routing) across repeated invocations
      in one session, plus compact guidance (run /compact every 5 preps) for prepping
      several interviews back-to-back. Extends the pattern from workflows/search-jobs/v3.md.
  - version: v3
    date: 2026-06-18
    summary: >
      Knowledge map (feat/ob1-knowledge-map): primary retrieval uses thought IDs from
      notes-index.md (mcp__job_search__fetch by ID) instead of search_chunks_semantic on
      notes.md; legacy fallback to v2 chunk-based retrieval when notes-index.md is absent;
      after generating prep brief, captures it as interview_prep thought and updates
      notes-index.md with thought ID
  - version: v2
    date: 2026-06-15
    summary: Added OB1 semantic retrieval (search_chunks_semantic) for notes.md and job-description.md sections with required-section fall-back; local mode falls back to full file reads; no output structure changes
  - version: v1
    date: 2026-06-12
    summary: Migrated from memory/feedback_interview_preparation.md and the output structure of .claude/commands/interview.md
