changelog:
  - version: v2
    date: 2026-06-21
    summary: >
      Adds domain verification gate: all domain fit/no-fit claims must check the "Domain Expertise"
      section of applicant.md before asserting; prevents false no-fit verdicts when earlier-career
      domain expertise exists (e.g., presales-se profile with FS background). Clarifies how to
      apply across jd-evaluation, process-jd, create-application, and ingest workflows.
