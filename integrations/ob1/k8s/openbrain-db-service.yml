---
# Expose PostgreSQL from the openbrain StatefulSet pod for cluster-internal access.
# Provides the openbrain database at openbrain-db.openbrain.svc.cluster.local:5432
# to job-search-mcp and other Deployments in the cluster.
#
# Apply once:
#   kubectl apply -f k8s/openbrain-db-service.yml
apiVersion: v1
kind: Service
metadata:
  name: openbrain-db
  namespace: openbrain
spec:
  selector:
    app: openbrain
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
