---
# Job-search-managed OB1 StatefulSet manifest.
# After the OB1 MCP + ob1-rest-pg merge, this pod runs ONE container only: db.
# The MCP server and LLM observability proxy (langfuse-proxy) have been removed;
# those capabilities now live in the job-search-mcp Deployment.
#
# Non-sensitive config from openbrain-configmap (DB_USER, DB_NAME only after merge).
# Sensitive values from openbrain-secret (postgres-password only after merge).
# Both are created/updated by: bash scripts/k8s-apply-env.sh
#
# Do NOT apply OB1's openbrain.yml or secrets.yml alongside this.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbrain

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbrain-init-sql
  namespace: openbrain
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS thoughts (
        id BIGSERIAL PRIMARY KEY,
        content TEXT NOT NULL,
        embedding vector(1536),
        metadata JSONB DEFAULT '{}'::jsonb,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_thoughts_created_at ON thoughts (created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_thoughts_metadata ON thoughts USING GIN (metadata);

    CREATE OR REPLACE FUNCTION match_thoughts(
        query_embedding vector(1536),
        match_threshold FLOAT DEFAULT 0.5,
        match_count INT DEFAULT 10,
        filter JSONB DEFAULT '{}'::jsonb
    )
    RETURNS TABLE (
        id BIGINT,
        content TEXT,
        metadata JSONB,
        similarity FLOAT,
        created_at TIMESTAMP WITH TIME ZONE
    )
    LANGUAGE plpgsql
    AS $$
    BEGIN
        RETURN QUERY
        SELECT
            t.id,
            t.content,
            t.metadata,
            (1 - (t.embedding <=> query_embedding))::FLOAT AS similarity,
            t.created_at
        FROM thoughts t
        WHERE 1 - (t.embedding <=> query_embedding) >= match_threshold
        ORDER BY t.embedding <=> query_embedding
        LIMIT match_count;
    END;
    $$;

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbrain
  namespace: openbrain
spec:
  serviceName: "openbrain"
  replicas: 1
  selector:
    matchLabels:
      app: openbrain
  template:
    metadata:
      labels:
        app: openbrain
    spec:
      containers:
        # Container 1 (only): PostgreSQL + pgvector
        - name: db
          image: ankane/pgvector:v0.5.1
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: openbrain-configmap
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbrain-secret
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: openbrain-configmap
                  key: DB_NAME
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi

      volumes:
        - name: init-sql
          configMap:
            name: openbrain-init-sql

  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hostpath
        resources:
          requests:
            storage: 5Gi

# The openbrain Service (port 8000, MCP) has been removed.
# Database access is provided by the separate openbrain-db Service (openbrain-db-service.yml).
