apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ob1-ingress
  namespace: openbrain
  annotations:
    # Strip the path prefix before forwarding to the backend service.
    # /job-search/sse → /sse  (job-search MCP — all OB1 + job-search tools)
    # /minio/         → /     (MinIO console)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # MCP servers use SSE streams for tool-call responses; the default 60s
    # proxy_read_timeout kills POST SSE streams during long LLM turns.
    # 300s covers all realistic tool call durations. The real fix is adding
    # POST SSE keepalive pings to @hono/mcp (tracked separately).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # Default client_max_body_size is 1m. Resume/portfolio uploads are
    # base64-encoded before the PUT (~1.33x overhead), so raw files as
    # small as ~768KB tripped this — surfaced as an unhandled 500 in the
    # webapp (httpx raise_for_status on the ingress's 413). 70m covers the
    # 50MB-raw upload cap enforced in webapp/backend/main.py after
    # base64 overhead, with headroom.
    nginx.ingress.kubernetes.io/proxy-body-size: "70m"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /job-search(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: job-search-mcp
            port:
              number: 8001
