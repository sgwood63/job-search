name: create-application
kind: workflow
description: Full JD pipeline — fetch, delegate screening and folder creation to process-jd, then fit resume generation and full notes expansion
status: active
pinned: v5
latest: v5
policies:
  - storage-routing
skills:
  - process-jd
  - resume-generation
inputs:
  - jd_source            # URL, document, or pasted text
outputs:
  - application_folder
  - verdict
  - resume_md            # fit only
changelog:
  - version: v5
    date: 2026-07-13
    summary: >
      Step 4b (Company Research thought) removed entirely — company context (structured
      reference + market/strategic narrative) now generated by process-jd Step 2.5
      (WebSearch) and lives in job-description.md ## Company & Market Context, available at
      Pending Review without opening notes.md; notes.md no longer has a ## Company Research
      section. Remaining Step 4 sub-steps renumbered (4c->4b Resume Strategy, 4d->4c
      notes-index.md update, 4e->4d generate notes.md). Context Loading — Session Reuse
      section added for this workflow and its sub-skills' companion policies, with compact
      guidance (every 3 completed applications) for multi-JD sessions.
  - version: v4
    date: 2026-06-18
    summary: >
      Knowledge map (feat/ob1-knowledge-map): replaces Step 4 notes-expansion with OB1 thought
      capture for domain_connection, company_research, and resume_strategy; updates notes-index.md
      with thought IDs; calls skills/application-summary to render notes.md. Status two-file rule
      now applies to notes-index.md. Local mode falls back to v3 Step 4 inline expansion.
  - version: v3
    date: 2026-06-14
    summary: OB1 audit trail — Step 0 adds ingest history check (check_position_seen) for previously-rejected positions; Step 2 always calls log_ingested_position after process-jd; Step 4a stores domain_connection via update_application_fields
  - version: v1
    date: 2026-06-12
    summary: Migrated from workflow.md steps 1-3 + fit/no-fit branches + JD regeneration + notes.md structure, memory/feedback_jd_file_saving.md, memory/feedback_application_tracking.md, memory/feedback_application_status_update.md
  - version: v2
    date: 2026-06-12
    summary: Delegates JD screening, folder creation, and file composition to workflows/process-jd/ (eliminates duplication with search-jobs and search-jobs-linkedin); v2 handles JD fetch + process-jd call + fit resume generation + full notes expansion
