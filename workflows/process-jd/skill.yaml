name: process-jd
kind: workflow
description: >
  Core JD processing module — screen via jd-evaluation (Haiku), derive folder slug,
  compose job-description.md / jd-*.md / notes-index.md / search-result.json (if provided),
  save per storage-routing, capture OB1 thoughts, write knowledge graph edges, and register
  in tracker. Called by create-application, search-jobs, and search-jobs-linkedin.
status: active
pinned: v3
latest: v3
policies:
  - storage-routing
  - factuality
  - evidence-grounding
  - company-descriptors
inputs:
  - jd_content          # full JD text, already fetched by caller
  - source_url          # apply URL or canonical source reference
  - source_name         # e.g. "SearchAPI / Google Jobs", "LinkedIn Recommendations", "Manual"
  - profile_hint        # optional profile slug; jd-evaluation may override
  - source_metadata     # optional dict: {via?, posted_at?, job_id?, raw_source_json?}
outputs:
  - folder_slug         # YYYY-MM-DD-company-role
  - application_id      # OB1 UUID or local folder path
  - verdict             # true/false
  - score               # 1-10
  - profile_match       # profile slug selected by jd-evaluation
changelog:
  - version: v3
    date: 2026-06-19
    summary: >
      Knowledge Map Phase 3 + OB1 IA Phase 3: Haiku screening gains domain_tags and
      jd_requirements_structured fields. New Step 4.5 (OB1 only): calls
      update_application_fields to store domain_tags + jd_requirements on js_applications.
      New Step 6 (OB1 only): creates company→requires→skill edges in OB1 entity graph via
      create_knowledge_edge (capped at 15 per application, idempotent). Draft promoted to v3.
  - version: v2
    date: 2026-06-18
    summary: >
      Knowledge map (feat/ob1-knowledge-map): replaces notes.md stub with notes-index.md
      (lightweight header + OB1 thought key registry). New Step 5 (OB1 only): captures
      jd_analysis and fit_assessment thoughts via mcp__open-brain__capture_thought;
      updates notes-index.md with returned thought IDs. Local mode unchanged (still writes
      notes.md v1 stub). Callers now call skills/application-summary to generate notes.md.
  - version: v1
    date: 2026-06-12
    summary: >
      Extracted shared JD processing logic from create-application/v1.md and
      commands/ingest.md + commands/ingestLI.md. Canonical single source for
      screening, folder creation, file composition, OB1/local routing, and
      tracker registration.
